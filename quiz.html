<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Oyunu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; margin-bottom: 20px; text-align: center; }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        .stat-label { font-size: 0.9em; color: #666; }
        .stat-value { font-size: 2em; color: #667eea; margin-top: 5px; }
        .question {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
        }
        .question h2 { font-size: 1.1em; margin-bottom: 20px; color: #333; line-height: 1.5; }
        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option {
            background: white;
            border: 2px solid #ddd;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 0.95em;
        }
        .option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #764ba2; }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
        }
        .correct { background: #d4edda; color: #155724; }
        .incorrect { background: #fff3cd; color: #856404; }
        .game-over {
            text-align: center;
        }
        .game-over h2 { color: #667eea; margin-bottom: 20px; }
        .final-score { font-size: 2.5em; color: #667eea; margin: 20px 0; }
        a {
            display: inline-block;
            margin: 10px 5px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        a:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quiz Oyunu</h1>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Soru</div>
                <div class="stat-value" id="questionNum">1/300</div>
            </div>
            <div class="stat">
                <div class="stat-label">Puan</div>
                <div class="stat-value" id="score">0</div>
            </div>
        </div>

        <div id="gameContent">
            <div class="question">
                <h2 id="question">Yükleniyor...</h2>
                <div class="options" id="options"></div>
                <button onclick="checkAnswer()">Cevap Gönder</button>
                <div id="message"></div>
            </div>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <div class="game-over">
                <h2>Oyun Bitti</h2>
                <div class="final-score" id="finalScore">0</div>
                <a href="javascript:location.reload()">Yeniden Başla</a>
                <a href="index.html">Anasayfa</a>
            </div>
        </div>
    </div>

            {q: "Mitokondri iç pH kaç?", options: ["6.5", "7.0", "8.0", "8.5"], correct: "8.0"},
            {q: "Sitoplazma pH kaç?", options: ["6.8", "7.2", "7.4", "7.8"], correct: "7.2"},
            {q: "Vaküol pH kaç?", options: ["3.5-4.5", "4.5-5.5", "5.5-6.5", "6.5-7.5"], correct: "5.5-6.5"},
            {q: "Endosom pH kaç?", options: ["4.5", "5.0", "6.0", "7.0"], correct: "6.0"},
            {q: "Lizozom pH kaç?", options: ["3.5-4.5", "4.5-5.5", "5.5-6.5", "6.5-7.5"], correct: "4.5-5.5"},
            {q: "Glutamat dehidrogenaz anaplerotic midir?", options: ["Hayır", "Evet", "Çoğunlukla", "Koşullu"], correct: "Evet"},
            {q: "PEP karboksilaz primer substrate hangisi?", options: ["Piruvat", "PEP", "Okaloasetat", "Malonil"], correct: "PEP"},
            {q: "Malat aspartat shuttle nereye gitsin?", options: ["Sitozol", "Mitokondri", "ER", "Peroksizom"], correct: "Mitokondri"},
            {q: "Pentoz fosfat yolu hangi ürün?", options: ["ATP", "NADPH R5P", "GTP", "FAD"], correct: "NADPH R5P"},
            {q: "Gliseroldehit-3-fosfat dehidrogenaz kofaktörü?", options: ["FAD", "NAD+", "NADP+", "FMN"], correct: "NAD+"},
            {q: "Ester bağı oluşumu nedir reaksiyonda?", options: ["Adisyon", "Dehidrasyonu", "Süpstitüsyon", "Redoks"], correct: "Dehidrasyonu"},
            {q: "Peptid bağı hangisini oluşturur?", options: ["N-C", "O-H", "C-N", "S-S"], correct: "C-N"},
            {q: "Disulfid bağı hangisinde oluşur?", options: ["Tirosin", "Prolin", "Sistein", "Histidin"], correct: "Sistein"},
            {q: "Aromatik amino asitleri hangisi?", options: ["Lys Arg His", "Asp Glu Asn", "Phe Tyr Trp", "Leu Ile Val"], correct: "Phe Tyr Trp"},
            {q: "Branşlı amino asitleri hangisi?", options: ["Met Cys Ser", "Leu Ile Val", "Asp Glu Asn", "Phe Tyr Trp"], correct: "Leu Ile Val"},
            {q: "Sülfür amino asitleri hangisi?", options: ["Phe Tyr", "Met Cys", "Leu Val", "Asp Glu"], correct: "Met Cys"},
            {q: "İmino asit hangisi?", options: ["Tirosin", "Prolin", "Sistein", "Lizin"], correct: "Prolin"},
            {q: "Basik amino asitleri hangisi?", options: ["Asp Glu", "Lys Arg His", "Ser Thr", "Phe Tyr"], correct: "Lys Arg His"},
            {q: "Asidik amino asitleri hangisi?", options: ["Lys Arg His", "Asp Glu", "Phe Tyr Trp", "Leu Ile Val"], correct: "Asp Glu"},
            {q: "Polar amino asitleri hangisi?", options: ["Val Ile Leu", "Ser Thr Asn Gln", "Phe Trp", "Pro"], correct: "Ser Thr Asn Gln"},
            {q: "Hidrofobik amino asitleri hangisi?", options: ["Asp Glu", "Ala Val Ile Leu Phe", "Ser Thr", "Pro"], correct: "Ala Val Ile Leu Phe"},
            {q: "Essensiyel amino asit kaçı?", options: ["7", "8", "9", "10"], correct: "9"},
            {q: "Koşullu essensiyel amino asit hangisi?", options: ["Val Ile Leu", "Arg", "Phe Tyr", "Met"], correct: "Arg"},
            {q: "Purine nükleotid kaçı vardır?", options: ["1", "2", "3", "4"], correct: "2"},
            {q: "Pirimidin nükleotid kaçı vardır?", options: ["1", "2", "3", "4"], correct: "3"},
            {q: "Ribose şekeri kaç atom vardır?", options: ["3", "4", "5", "6"], correct: "5"},
            {q: "Deoksiribose şekeri kaç atom vardır?", options: ["3", "4", "5", "6"], correct: "5"},
            {q: "DNA major groove kaç genişlik?", options: ["12Å", "14Å", "22Å", "12Å"], correct: "22Å"},
            {q: "DNA minor groove kaç genişlik?", options: ["12Å", "14Å", "22Å", "20Å"], correct: "12Å"},
            {q: "DNA B formu heliks pitch kaç Å?", options: ["25", "30", "34", "40"], correct: "34"},
            {q: "Nukleotid kaç bileşenden oluşur?", options: ["2", "3", "4", "5"], correct: "3"},
            {q: "Fosfodiester bağı nedir yapısında?", options: ["C-N", "C-O-P-O-C", "N-H", "S-S"], correct: "C-O-P-O-C"}
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;

        function showQuestion() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }
            const q = questions[currentQuestion];
            document.getElementById('question').textContent = q.q;
            document.getElementById('questionNum').textContent = (currentQuestion + 1) + '/' + questions.length;
            document.getElementById('message').innerHTML = '';
            selectedOption = null;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.onclick = () => selectOption(opt, div);
                optionsDiv.appendChild(div);
            });
        }

        function selectOption(option, element) {
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedOption = option;
        }

        function checkAnswer() {
            if (!selectedOption) {
                alert('Bir seçenek seç!');
                return;
            }
            
            const correct = questions[currentQuestion].correct;
            const messageDiv = document.getElementById('message');

            if (selectedOption === correct) {
                messageDiv.innerHTML = 'Doğru +10 Puan';
                messageDiv.className = 'message correct';
                score += 10;
                document.getElementById('score').textContent = score;
                currentQuestion++;
                setTimeout(showQuestion, 1000);
            } else {
                messageDiv.innerHTML = 'Yanlış! Doğru: ' + correct;
                messageDiv.className = 'message incorrect';
                currentQuestion++;
                setTimeout(showQuestion, 2000);
            }
        }

        function endGame() {
            document.getElementById('gameContent').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
        }

        showQuestion();
    </script>
</body>
</html>
